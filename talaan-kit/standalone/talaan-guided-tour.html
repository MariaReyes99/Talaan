<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Talaan guided tour</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --page:#E9EFF5; --page-ink:#14304F; --page-muted:#566779; --card:#FFFFFF; --card-line:#D6E0EA;
  --navy:#12355B; --ink:#1F2A37; --muted:#5B6B7B; --line:#DCE4EC; --soft:#F4F7FA;
  --blue:#1E88C7; --blue-pale:#E3F1FA; --mango:#F6B21A; --mango-deep:#C98A00; --mango-pale:#FFF4D9;
  --green:#2E9E5B; --green-pale:#E2F4E9; --amber:#E0860B; --amber-pale:#FDEFD9; --red:#D9434E; --red-pale:#FBE4E6;
  --ube:#6E56CF; --ube-pale:#EEEAFB;
  --font:"Plus Jakarta Sans","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --page:#0F1B29; --page-ink:#E6EEF6; --page-muted:#9DB0C3; --card:#16263A; --card-line:#27405C; } }
:root[data-theme="dark"]{ --page:#0F1B29; --page-ink:#E6EEF6; --page-muted:#9DB0C3; --card:#16263A; --card-line:#27405C; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--page);color:var(--page-ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--mango);outline-offset:2px}
.page{max-width:1080px;margin:0 auto;padding:20px 16px 32px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:10px}
.word{font-weight:800;font-size:24px;letter-spacing:-.5px;color:var(--page-ink)}
.word i{font-style:normal;color:var(--mango)}
.sub{color:var(--page-muted);font-size:14px;padding-left:10px;border-left:1px solid var(--card-line)}
.langs{display:flex;background:var(--card);border:1px solid var(--card-line);border-radius:999px;padding:4px;gap:2px}
.langs button{border:0;background:transparent;padding:7px 14px;border-radius:999px;font-weight:600;font-size:14px;color:var(--page-muted)}
.langs button[aria-pressed="true"]{background:var(--navy);color:#fff}
.player{background:var(--card);border:1px solid var(--card-line);border-radius:18px;padding:14px;box-shadow:0 18px 40px -28px rgba(18,53,91,.45)}
.stage-wrap{position:relative;width:100%;overflow:hidden;border-radius:12px;background:#DCE6F0}
.stage{position:absolute;left:0;top:0;width:960px;height:540px;transform-origin:0 0;background:var(--soft);color:var(--ink);font-size:15px}
.appbar{height:48px;background:var(--navy);display:flex;align-items:center;padding:0 18px;gap:22px;color:#fff}
.appbar .mini{display:flex;align-items:center;gap:7px;font-weight:800;font-size:17px;margin-right:10px}
.appbar nav{display:flex;gap:4px;height:100%}
.appbar nav span{display:flex;align-items:center;padding:0 12px;font-size:14px;font-weight:500;color:#B9CCE0;border-bottom:3px solid transparent}
.appbar nav span.on{color:#fff;border-bottom-color:var(--mango)}
.appbar .who{margin-left:auto;width:30px;height:30px;border-radius:50%;background:var(--blue);display:grid;place-items:center;font-size:12px;font-weight:700}
.screen>.sc{height:100%}
.screen{position:absolute;left:0;right:0;top:48px;bottom:0;padding:26px 30px;overflow:hidden}
.overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(18,53,91,.55);z-index:5}
.overlay button{display:flex;align-items:center;gap:12px;border:0;background:var(--mango);color:#1E2A10;font-weight:800;font-size:22px;padding:16px 30px 16px 22px;border-radius:999px;box-shadow:0 10px 30px -10px rgba(0,0,0,.5)}
.overlay[hidden]{display:none}
.caption{display:flex;gap:16px;align-items:center;padding:16px 6px 6px}
.tala{flex:0 0 72px;height:72px}
.cap-text h2{margin:0 0 2px;font-size:19px;font-weight:700;color:var(--page-ink)}
.cap-text p{margin:0;font-size:16px;color:var(--page-ink);max-width:68ch}
.progress{display:flex;gap:5px;padding:12px 6px 4px}
.progress button{flex:1;height:8px;border:0;border-radius:99px;background:var(--card-line);padding:0;position:relative;overflow:hidden}
.progress button.done{background:var(--blue)}
.progress button .fill{position:absolute;inset:0;width:0;background:var(--blue);border-radius:99px}
.progress button.cur .fill{animation:fill var(--dur,6s) linear forwards}
.paused .progress button.cur .fill{animation-play-state:paused}
@keyframes fill{to{width:100%}}
.controls{display:flex;align-items:center;gap:10px;padding:8px 6px 2px;flex-wrap:wrap}
.cbtn{border:1px solid var(--card-line);background:var(--card);border-radius:10px;padding:8px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:7px;color:var(--page-ink)}
.cbtn.main{background:var(--blue);border-color:var(--blue);color:#fff;padding:9px 20px}
.count{color:var(--page-muted);font-size:14px;margin-left:4px}
.spacer{flex:1}
.note{margin:6px 6px 0;color:var(--page-muted);font-size:13px;min-height:1em}
.foot{color:var(--page-muted);font-size:13px;text-align:center;margin-top:14px}
svg.ic{width:18px;height:18px;flex:none}

/* mock screen pieces */
.sc h3{margin:0;font-size:22px;font-weight:700;color:var(--navy)}
.muted{color:var(--muted)}
.row{display:flex;gap:16px;align-items:center}
.panel{background:#fff;border:1px solid var(--line);border-radius:12px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:4px 10px;border-radius:99px;white-space:nowrap}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.ok{color:var(--green);background:var(--green-pale)} .soon{color:var(--amber);background:var(--amber-pale)} .late{color:var(--red);background:var(--red-pale)}
.tbl{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tbl th{font-size:13px;text-align:left;color:var(--muted);font-weight:600;padding:11px 16px;background:#F7FAFC;border-bottom:1px solid var(--line)}
.tbl td{padding:13px 16px;border-bottom:1px solid var(--line);font-size:15px}
.tbl tr:last-child td{border-bottom:0}
.num{text-align:right;font-variant-numeric:tabular-nums}
.btn{border:0;border-radius:9px;padding:9px 16px;font-weight:700;font-size:14px;background:var(--blue);color:#fff}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn.red{background:var(--red)} .btn.amber{background:var(--amber)}
.in{opacity:0;animation:up .5s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:var(--d,0ms)}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.pop{opacity:0;animation:pop .35s ease-out forwards;animation-delay:var(--d,0ms)}
@keyframes pop{0%{opacity:0;transform:scale(.6)}70%{transform:scale(1.12)}100%{opacity:1;transform:none}}

/* intro */
.intro .hero{display:flex;align-items:center;gap:40px;height:100%;padding:10px 30px}
.intro h3{font-size:44px;letter-spacing:-1px}
.intro p{font-size:20px;color:var(--muted);margin:6px 0 26px}
.tiles{display:flex;gap:14px}
.tile{display:flex;align-items:center;gap:10px;padding:14px 18px;border-radius:12px;background:#fff;border:1px solid var(--line);font-weight:700}
.tile i{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-style:normal}
/* home */
.home .head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:16px}
/* payrun */
.steps{display:flex;gap:0;margin-bottom:20px}
.step{flex:1;display:flex;align-items:center;gap:9px;font-size:14px;font-weight:600;color:var(--muted);position:relative}
.step b{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#fff;border:2px solid var(--line);font-size:13px;flex:none}
.step.done b{background:var(--green);border-color:var(--green);color:#fff}
.step.cur{color:var(--navy)} .step.cur b{border-color:var(--blue);color:var(--blue);box-shadow:0 0 0 4px var(--blue-pale)}
.step:not(:last-child)::after{content:"";flex:1;height:2px;background:var(--line);margin:0 10px}
.drop{border:2px dashed #B9CDE0;border-radius:12px;padding:22px;display:flex;align-items:center;gap:16px;background:#FBFDFF}
.file{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;background:var(--green-pale);color:#18623A;font-weight:600}
.good{display:flex;align-items:center;gap:10px;color:#18623A;font-weight:600}
.memo{display:flex;align-items:center;gap:10px;background:var(--mango-pale);border-radius:10px;padding:10px 14px;color:#6B4A00;font-weight:600}
/* checks */
.check{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-left-width:6px;border-radius:10px;padding:13px 16px;margin-bottom:10px;font-size:15px}
.check .t{flex:1}
.check.r{border-left-color:var(--red)} .check.a{border-left-color:var(--amber)} .check.g{border-left-color:var(--green)}
.dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px;flex:none}
/* approve */
.ap{display:grid;grid-template-columns:1fr 300px;gap:36px;height:100%;align-items:center}
.person{display:flex;align-items:center;gap:12px;padding:14px 16px;background:#fff;border:1px solid var(--line);border-radius:12px}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700}
.role{font-size:12px;font-weight:700;color:var(--muted)}
.phone{width:290px;height:440px;border-radius:34px;background:#0E2440;padding:12px;box-shadow:0 20px 40px -20px rgba(14,36,64,.6);margin:0 auto}
.phone .scr{width:100%;height:100%;border-radius:24px;background:#fff;overflow:hidden;display:flex;flex-direction:column}
.phone .bar{background:var(--navy);color:#fff;padding:14px 16px 12px;font-weight:700}
.phone .bd{padding:14px 16px;flex:1;display:flex;flex-direction:column;gap:7px;font-size:14px}
.kv{display:flex;justify-content:space-between;gap:8px}
.kv b{font-variant-numeric:tabular-nums}
.press{animation:press .5s ease forwards;animation-delay:var(--d,0ms)}
@keyframes press{0%{transform:none}40%{transform:scale(.94);filter:brightness(.9)}100%{transform:none;background:var(--green)}}
.lock{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:99px;background:var(--navy);color:#fff;font-weight:600;font-size:14px}
/* files */
.agency{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:10px}
.box{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);display:inline-grid;place-items:center;position:relative}
.box svg{opacity:0;animation:pop .3s ease-out forwards;animation-delay:var(--d)}
.box::after{content:"";position:absolute;inset:-2px;border-radius:6px;background:var(--green);opacity:0;animation:fadein .2s forwards;animation-delay:var(--d);z-index:-1}
.box{z-index:0}
@keyframes fadein{to{opacity:1}}
.toast{position:absolute;right:30px;bottom:24px;display:flex;align-items:center;gap:10px;background:var(--navy);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600}
/* xero */
.xbadge{display:inline-flex;align-items:center;gap:8px;background:#13B5EA;color:#fff;font-weight:700;padding:8px 14px;border-radius:99px}
/* ask */
.chat{max-width:700px;margin:0 auto;display:flex;flex-direction:column;gap:14px;height:100%}
.chat>*{flex-shrink:0}
.bub{padding:13px 16px;border-radius:16px;font-size:16px;max-width:80%}
.bub.me{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:4px}
.bub.tala{background:var(--ube-pale);color:#2E2266;border-bottom-left-radius:4px}
.src{display:flex;width:fit-content;gap:6px;margin-top:10px;font-size:13px;font-weight:600;background:#fff;color:var(--ube);border:1px solid #D7CFF7;padding:5px 10px;border-radius:8px}
.askbar{margin-top:auto;display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--muted)}
/* language */
.langcards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.lc{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.lc h4{margin:0;padding:12px 16px;background:var(--navy);color:#fff;font-size:16px}
.lc .bd{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
mark{background:var(--mango-pale);color:#6B4A00;border-radius:4px;padding:0 3px;font-weight:700}
/* ready */
.ready{display:flex;align-items:center;justify-content:center;gap:44px;height:100%}
.pts{display:flex;flex-direction:column;gap:12px;margin:16px 0 24px}
.pt{display:flex;align-items:center;gap:12px;font-size:20px;font-weight:700;color:var(--navy)}

/* Tala */
.tala-svg{width:100%;height:100%;overflow:visible}
.tala-svg .mouth{transform-origin:50px 64px;transform-box:view-box}
.talking .tala-svg .mouth{animation:talk .28s ease-in-out infinite alternate}
@keyframes talk{from{transform:scaleY(.4)}to{transform:scaleY(1.25)}}
.wave .tala-svg{animation:wave 1.6s ease-in-out infinite;transform-origin:50% 90%}
@keyframes wave{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}

@media (max-width:640px){ #prevBtn span,#nextBtn span{display:none} .caption{align-items:flex-start} .sub{display:none} .cap-text h2{font-size:17px} .cap-text p{font-size:15px} .tala{flex-basis:56px;height:56px} .cbtn{padding:8px 11px} .count{display:none} }
@media (prefers-reduced-motion: reduce){ .in,.pop,.box svg,.box::after,.press{animation-duration:1ms!important;animation-delay:0ms!important} .wave .tala-svg,.talking .tala-svg .mouth{animation:none} }
</style>
</head>
<body>
<div class="page" id="app">
  <header class="top">
    <div class="brand">
      <span id="logoMark"></span>
      <span class="word">tala<i>a</i>n</span>
      <span class="sub" data-t="controls.tourTitle"></span>
    </div>
    <div class="langs" role="group" id="langs"></div>
  </header>
  <main class="player paused" id="player">
    <div class="stage-wrap" id="wrap">
      <div class="stage" id="stage" aria-hidden="true">
        <div class="appbar">
          <span class="mini" id="miniMark"></span>
          <nav id="nav"></nav>
          <span class="who">MS</span>
        </div>
        <div class="screen" id="screen"></div>
      </div>
      <div class="overlay" id="overlay"><button id="bigPlay" type="button"></button></div>
    </div>
    <div class="caption">
      <div class="tala" id="talaCap"></div>
      <div class="cap-text" aria-live="polite"><h2 id="capTitle"></h2><p id="capLine"></p></div>
    </div>
    <div class="progress" id="progress"></div>
    <div class="controls">
      <button class="cbtn" id="prevBtn" type="button"></button>
      <button class="cbtn main" id="playBtn" type="button"></button>
      <button class="cbtn" id="nextBtn" type="button"></button>
      <span class="count" id="count"></span>
      <span class="spacer"></span>
      <button class="cbtn" id="voiceBtn" type="button" aria-pressed="false"></button>
    </div>
    <p class="note" id="note"></p>
  </main>
  <p class="foot" data-t="controls.mockNote"></p>
</div>
<script>
const MESSAGES = {"en": {"meta": {"langName": "English", "htmlLang": "en", "voiceLang": "en-PH"}, "controls": {"tourTitle": "Talaan guided tour", "play": "Play", "pause": "Pause", "prev": "Previous", "next": "Next", "voiceOn": "Voice on", "voiceOff": "Voice off", "sceneOf": "{current} of {total}", "language": "Language", "replay": "Replay tour", "voiceMissing": "No voice for this language on this device. Captions are on.", "mockNote": "Sample data for illustration. Talaan is in design.", "startUsing": "Start using Talaan", "close": "Close tour", "voiceLabel": "Voice", "sounds": "Sounds", "female": "Female", "male": "Male", "testVoice": "Test voice", "guess": "guess", "otherLang": "other language", "noVoices": "This browser has no speech voices. Captions still play. Try Microsoft Edge or Google Chrome, or install a voice in your device settings.", "voiceTipTl": "For Tagalog, Microsoft Edge offers Filipino voices (Blessica and Angelo). Other browsers read Tagalog with an English voice.", "loadingVoices": "Loading voices…", "testLine": "Hi, I’m {name}. Let’s get started."}, "nav": {"home": "Home", "clients": "Clients", "payRuns": "Pay runs", "files": "Files", "employees": "Employees"}, "scenes": {"intro": {"title": "Hi, I’m {name}", "line": "Hi, I’m {name}, your guide to Talaan. In two minutes I’ll show you how to run payroll for all your clients, with fewer clicks and fewer mistakes."}, "home": {"title": "Your home screen", "line": "Every client on one screen. Green means on track, yellow means a deadline is near, and red means something needs you today."}, "payrun": {"title": "Run payroll in five steps", "line": "Pick the client and the cutoff, bring in the hours, let Talaan check them, approve, then get your files. One step per screen, so you always know where you are."}, "checks": {"title": "Talaan catches mistakes for you", "line": "Before anything is paid, Talaan checks every employee. Red stops you until it’s fixed. Yellow asks for a short reason. Each message t /* Tala: an original star mascot */
function starPts(cx,cy,R,r){ const p=[]; for(let i=0;i<10;i++){ const a=-Math.PI/2+i*Math.PI/5, rad=i%2?r:R; p.push((cx+rad*Math.cos(a)).toFixed(1)+','+(cy+rad*Math.sin(a)).toFixed(1)); } return p.join(' '); }
function talaSVG(){ return `<svg class="tala-svg" viewBox="0 0 100 100" role="img" aria-label="Tala"><polygon points="${starPts(50,54,44,24)}" fill="#F6B21A" stroke="#F6B21A" stroke-width="10" stroke-linejoin="round"/><polygon points="${starPts(50,54,44,24)}" fill="none" stroke="#C98A00" stroke-width="2" stroke-linejoin="round" opacity=".35"/><ellipse cx="41" cy="52" rx="3.6" ry="4.6" fill="#1F2A37"/><ellipse cx="59" cy="52" rx="3.6" ry="4.6" fill="#1F2A37"/><circle cx="42.2" cy="50.6" r="1.2" fill="#fff"/><circle cx="60.2" cy="50.6" r="1.2" fill="#fff"/><ellipse cx="34" cy="60" rx="4" ry="2.6" fill="#F08A5D" opacity=".55"/><ellipse cx="66" cy="60" rx="4" ry="2.6" fill="#F08A5D" opacity=".55"/><g class="mouth"><path d="M43 62 Q50 69 57 62 Q50 65 43 62z" fill="#7A2E1F"/></g></svg>`; }
function markSVG(size){ return `<svg width="${size}" height="${size}" viewBox="0 0 100 100" aria-hidden="true"><polygon points="${starPts(50,54,44,24)}" fill="#F6B21A" stroke="#F6B21A" stroke-width="10" stroke-linejoin="round"/></svg>`; }

/* Elements */
const $ = id => document.getElementById(id);
const screen = $('screen'), player = $('player');
$('logoMark').innerHTML = markSVG(30); $('miniMark').innerHTML = markSVG(22) + 'talaan';
$('talaCap').innerHTML = talaSVG();
$('progress').innerHTML = SCENES.map((s,i)=>`<button type="button" data-i="${i}"><span class="fill"></span></button>`).join('');
$('langs').innerHTML = LANGS.map(l=>`<button type="button" data-l="${l}" lang="${MESSAGES[l].meta.htmlLang}">${esc(MESSAGES[l].meta.langName)}</button>`).join('');

function durationFor(line){ const zh = lang === 'zh-Hans'; return Math.max(6500, line.length * (zh ? 210 : 62)); }

function staticText(){
  document.documentElement.lang = MESSAGES[lang].meta.htmlLang;
  document.title = t('controls.tourTitle');
  document.querySelectorAll('[data-t]').forEach(el => el.textContent = t(el.dataset.t));
  $('langs').setAttribute('aria-label', t('controls.language'));
  $('langs').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.l === lang)));
  $('prevBtn').innerHTML = ICON.prev + `<span>${T('controls.prev')}</span>`;
  $('nextBtn').innerHTML = `<span>${T('controls.next')}</span>` + ICON.next;
  $('playBtn').innerHTML = (playing ? ICON.pause : ICON.play) + `<span>${playing ? T('controls.pause') : T('controls.play')}</span>`;
  $('voiceBtn').innerHTML = ICON.voice + `<span>${voice ? T('controls.voiceOn') : T('controls.voiceOff')}</span>`;
  $('voiceBtn').setAttribute('aria-pressed', String(voice));
  $('bigPlay').innerHTML = ICON.play.replace('class="ic"','class="ic" style="width:26px;height:26px"') + T('controls.play');
  $('nav').innerHTML = ['home','clients','payRuns','files','employees'].map(k=>`<span data-k="${k}">${T('nav.'+k)}</span>`).join('');
}

function render(){
  const id = SCENES[idx];
  screen.innerHTML = SCREENS[id]();
  screen.querySelectorAll('[data-d]').forEach(el => el.style.setProperty('--d', el.dataset.d + 'ms'));
  $('capTitle').textContent = t(`scenes.${id}.title`);
  $('capLine').textContent = t(`scenes.${id}.line`);
  $('count').textContent = t('controls.sceneOf', {current: idx+1, total: SCENES.length});
  $('nav').querySelectorAll('span').forEach(s => s.classList.toggle('on', s.dataset.k === NAV_FOR[id]));
  $('talaCap').parentElement.classList.toggle('wave', id === 'intro' || id === 'ready');
  const r = $('replayInline'); if (r) r.onclick = () => { go(0); setPlaying(true); };
  [...$('progress').children].forEach((b,i) => { b.classList.toggle('done', i < idx); b.classList.remove('cur'); });
  const cur = $('progress').children[idx]; void cur.offsetWidth; cur.style.setProperty('--dur', durationFor(t(`scenes.${id}.line`)) + 'ms'); cur.classList.add('cur');
}

let VOICES = [];
function refreshVoices(){ if ('speechSynthesis' in window) VOICES = speechSynthesis.getVoices(); }
if ('speechSynthesis' in window) { refreshVoices(); speechSynthesis.onvoiceschanged = refreshVoices; let n = 0; const poll = setInterval(() => { refreshVoices(); if (VOICES.length || ++n > 25) clearInterval(poll); }, 200); }
function findVoice(){
  if (!VOICES.length) refreshVoices(); if (!VOICES.length) return null;
  const order = { en: ['en-ph', 'en'], tl: ['fil', 'tl', 'en-ph', 'en'], 'zh-Hans': ['zh-cn', 'zh'] }[lang] || ['en'];
  for (const p of order) { const v = VOICES.find(x => x.lang.toLowerCase().replace('_', '-').startsWith(p)); if (v) return v; }
  return VOICES.find(v => v.default) || VOICES[0];
}
function chunks(text){ return (text.match(/[^.!?。！？；;]+[.!?。！？；;]*\s*/g) || [text]).map(x => x.trim()).filter(Boolean); }
let keepAlive = null;
function stopTiming(){ clearTimeout(timer); timer = null; clearInterval(keepAlive); if ('speechSynthesis' in window) speechSynthesis.cancel(); utter = null; $('talaCap').parentElement.classList.remove('talking'); }

function schedule(){
  stopTiming();
  if (!playing) return;
  const line = t(`scenes.${SCENES[idx]}.line`);
  const advance = () => { if (idx < SCENES.length - 1) { go(idx + 1); } else { setPlaying(false); } };
  const v = voice ? findVoice() : null;
  $('note').textContent = (voice && !v) ? t('controls.voiceMissing') : '';
  if (v) {
    const parts = chunks(line); let i = 0; const myRun = Symbol(); utter = myRun;
    keepAlive = setInterval(() => { if (speechSynthesis.speaking && !speechSynthesis.paused) { speechSynthesis.pause(); speechSynthesis.resume(); } }, 10000);
    const next = () => {
      if (utter !== myRun) return;
      if (i >= parts.length) { clearInterval(keepAlive); $('talaCap').parentElement.classList.remove('talking'); if (playing) timer = setTimeout(advance, 900); return; }
      const u = new SpeechSynthesisUtterance(parts[i++]); u.voice = v; u.lang = v.lang; u.rate = 0.98;
      u.onstart = () => $('talaCap').parentElement.classList.add('talking'); u.onend = next; u.onerror = next;
      speechSynthesis.speak(u);
    };
    if (speechSynthesis.paused) speechSynthesis.resume();
    next();
  } else {
    $('talaCap').parentElement.classList.add('talking');
    setTimeout(() => $('talaCap').parentElement.classList.remove('talking'), Math.min(durationFor(line) - 800, 4500));
    timer = setTimeout(advance, durationFor(line));
  }
}

function go(i){ $('overlay').hidden = true; idx = Math.max(0, Math.min(SCENES.length - 1, i)); render(); schedule(); }
function setPlaying(p){ playing = p; player.classList.toggle('paused', !p); $('overlay').hidden = true; staticText(); render(); schedule(); }

$('playBtn').onclick = () => setPlaying(!playing);
$('bigPlay').onclick = () => setPlaying(true);
$('prevBtn').onclick = () => go(idx - 1);
$('nextBtn').onclick = () => go(idx + 1);
$('voiceBtn').onclick = () => { voice = !voice; refreshVoices(); staticText(); schedule(); };
$('progress').onclick = e => { const b = e.target.closest('button'); if (b) go(+b.dataset.i); };
$('langs').onclick = e => { const b = e.target.closest('button'); if (!b) return; lang = b.dataset.l; try { localStorage.setItem('talaan-tour-lang', lang); } catch(e) {} staticText(); render(); schedule(); };
document.addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('button') && e.key === ' ') return;
  if (e.key === ' ') { e.preventDefault(); setPlaying(!playing); }
  if (e.key === 'ArrowRight') go(idx + 1);
  if (e.key === 'ArrowLeft') go(idx - 1);
});

const wrap = $('wrap'), stage = $('stage');
function fit(){ const s = wrap.clientWidth / 960; stage.style.transform = `scale(${s})`; wrap.style.height = (540 * s) + 'px'; }
new ResizeObserver(fit).observe(wrap); fit();
staticText(); render();
</script>
