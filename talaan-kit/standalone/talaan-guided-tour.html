.talaan-tour{
  --page:#E9EFF5; --page-ink:#14304F; --page-muted:#566779; --card:#FFFFFF; --card-line:#D6E0EA;
  --navy:#0B2350; --ink:#1F2A37; --muted:#5B6B7B; --line:#DCE4EC; --soft:#F4F7FA;
  --blue:#1F5FAE; --blue-pale:#E4ECF8; --mango:#D4A12A; --mango-deep:#A87A12; --mango-pale:#FBF1D6;
  --green:#2E9E5B; --green-pale:#E2F4E9; --amber:#E0860B; --amber-pale:#FDEFD9; --red:#D9434E; --red-pale:#FBE4E6;
  --ube:#6E56CF; --ube-pale:#EEEAFB;
  --font:"Plus Jakarta Sans","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){.talaan-tour{ --page:#0F1B29; --page-ink:#E6EEF6; --page-muted:#9DB0C3; --card:#16263A; --card-line:#27405C; }
 }
[data-theme="dark"] .talaan-tour{ --page:#0F1B29; --page-ink:#E6EEF6; --page-muted:#9DB0C3; --card:#16263A; --card-line:#27405C; }
.talaan-tour *{box-sizing:border-box}
.talaan-tour{background:var(--page);color:var(--page-ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.talaan-tour button{font:inherit;color:inherit;cursor:pointer}
.talaan-tour button:focus-visible{outline:3px solid var(--mango);outline-offset:2px}
.talaan-tour .page{max-width:1080px;margin:0 auto;padding:20px 16px 32px}
.talaan-tour .top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.talaan-tour .brand{display:flex;align-items:center;gap:10px}
.talaan-tour .word{font-family:Montserrat,var(--font,inherit);font-weight:700;font-size:22px;letter-spacing:.14em;background:linear-gradient(180deg,#F5D27A 0%,#D4A12A 55%,#A87A12 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.talaan-tour .word i{font-style:normal;color:var(--mango)}
.talaan-tour .sub{color:var(--page-muted);font-size:14px;padding-left:10px;border-left:1px solid var(--card-line)}
.talaan-tour .langs{display:flex;background:var(--card);border:1px solid var(--card-line);border-radius:999px;padding:4px;gap:2px}
.talaan-tour .langs button{border:0;background:transparent;padding:7px 14px;border-radius:999px;font-weight:600;font-size:14px;color:var(--page-muted)}
.talaan-tour .langs button[aria-pressed="true"]{background:var(--navy);color:#fff}
.talaan-tour .player{background:var(--card);border:1px solid var(--card-line);border-radius:18px;padding:14px;box-shadow:0 18px 40px -28px rgba(18,53,91,.45)}
.talaan-tour .stage-wrap{position:relative;width:100%;overflow:hidden;border-radius:12px;background:#DCE6F0}
.talaan-tour .stage{position:absolute;left:0;top:0;width:960px;height:540px;transform-origin:0 0;background:var(--soft);color:var(--ink);font-size:15px}
.talaan-tour .appbar{height:48px;background:var(--navy);display:flex;align-items:center;padding:0 18px;gap:22px;color:#fff}
.talaan-tour .appbar .mini{display:flex;align-items:center;gap:7px;font-family:Montserrat,inherit;font-weight:700;font-size:15px;letter-spacing:.14em;color:#F0C25A;margin-right:10px}
.talaan-tour .appbar nav{display:flex;gap:4px;height:100%}
.talaan-tour .appbar nav span{display:flex;align-items:center;padding:0 12px;font-size:14px;font-weight:500;color:#B9CCE0;border-bottom:3px solid transparent}
.talaan-tour .appbar nav span.on{color:#fff;border-bottom-color:var(--mango)}
.talaan-tour .appbar .who{margin-left:auto;width:30px;height:30px;border-radius:50%;background:var(--blue);display:grid;place-items:center;font-size:12px;font-weight:700}
.talaan-tour .screen>.sc{height:100%}
.talaan-tour .screen{position:absolute;left:0;right:0;top:48px;bottom:0;padding:26px 30px;overflow:hidden}
.talaan-tour .overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(18,53,91,.55);z-index:5}
.talaan-tour .overlay button{display:flex;align-items:center;gap:12px;border:0;background:var(--mango);color:#1E2A10;font-weight:800;font-size:22px;padding:16px 30px 16px 22px;border-radius:999px;box-shadow:0 10px 30px -10px rgba(0,0,0,.5)}
.talaan-tour .overlay[hidden]{display:none}
.talaan-tour .caption{display:flex;gap:16px;align-items:center;padding:16px 6px 6px}
.talaan-tour .tala{flex:0 0 72px;height:72px}
.talaan-tour .cap-text h2{margin:0 0 2px;font-size:19px;font-weight:700;color:var(--page-ink)}
.talaan-tour .cap-text p{margin:0;font-size:16px;color:var(--page-ink);max-width:68ch}
.talaan-tour .progress{display:flex;gap:5px;padding:12px 6px 4px}
.talaan-tour .progress button{flex:1;height:8px;border:0;border-radius:99px;background:var(--card-line);padding:0;position:relative;overflow:hidden}
.talaan-tour .progress button.done{background:var(--blue)}
.talaan-tour .progress button .fill{position:absolute;inset:0;width:0;background:var(--blue);border-radius:99px}
.talaan-tour .progress button.cur .fill{animation:fill var(--dur,6s) linear forwards}
.talaan-tour .paused .progress button.cur .fill{animation-play-state:paused}
@keyframes fill{to{width:100%}}
.talaan-tour .controls{display:flex;align-items:center;gap:10px;padding:8px 6px 2px;flex-wrap:wrap}
.talaan-tour .cbtn{border:1px solid var(--card-line);background:var(--card);border-radius:10px;padding:8px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:7px;color:var(--page-ink)}
.talaan-tour .cbtn.main{background:var(--blue);border-color:var(--blue);color:#fff;padding:9px 20px}
.talaan-tour .count{color:var(--page-muted);font-size:14px;margin-left:4px}
.talaan-tour .spacer{flex:1}
.talaan-tour .note{margin:6px 6px 0;color:var(--page-muted);font-size:13px;min-height:1em}
.talaan-tour .foot{color:var(--page-muted);font-size:13px;text-align:center;margin-top:14px}
.talaan-tour svg.ic{width:18px;height:18px;flex:none}
.talaan-tour /* mock screen pieces */
.sc h3{margin:0;font-size:22px;font-weight:700;color:var(--navy)}
.talaan-tour .muted{color:var(--muted)}
.talaan-tour .row{display:flex;gap:16px;align-items:center}
.talaan-tour .panel{background:#fff;border:1px solid var(--line);border-radius:12px}
.talaan-tour .chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:4px 10px;border-radius:99px;white-space:nowrap}
.talaan-tour .chip::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.talaan-tour .ok{color:var(--green);background:var(--green-pale)}
.talaan-tour .soon{color:var(--amber);background:var(--amber-pale)}
.talaan-tour .late{color:var(--red);background:var(--red-pale)}
.talaan-tour .tbl{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.talaan-tour .tbl th{font-size:13px;text-align:left;color:var(--muted);font-weight:600;padding:11px 16px;background:#F7FAFC;border-bottom:1px solid var(--line)}
.talaan-tour .tbl td{padding:13px 16px;border-bottom:1px solid var(--line);font-size:15px}
.talaan-tour .tbl tr:last-child td{border-bottom:0}
.talaan-tour .num{text-align:right;font-variant-numeric:tabular-nums}
.talaan-tour .btn{border:0;border-radius:9px;padding:9px 16px;font-weight:700;font-size:14px;background:var(--blue);color:#fff}
.talaan-tour .btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
.talaan-tour .btn.red{background:var(--red)}
.talaan-tour .btn.amber{background:var(--amber)}
.talaan-tour .in{opacity:0;animation:up .5s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:var(--d,0ms)}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.talaan-tour .pop{opacity:0;animation:pop .35s ease-out forwards;animation-delay:var(--d,0ms)}
@keyframes pop{0%{opacity:0;transform:scale(.6)}70%{transform:scale(1.12)}100%{opacity:1;transform:none}}
.talaan-tour /* intro */
.intro .hero{display:flex;align-items:center;gap:40px;height:100%;padding:10px 30px}
.talaan-tour .intro h3{font-size:44px;letter-spacing:-1px}
.talaan-tour .intro p{font-size:20px;color:var(--muted);margin:6px 0 26px}
.talaan-tour .tiles{display:flex;gap:14px}
.talaan-tour .tile{display:flex;align-items:center;gap:10px;padding:14px 18px;border-radius:12px;background:#fff;border:1px solid var(--line);font-weight:700}
.talaan-tour .tile i{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-style:normal}
.talaan-tour /* home */
.home .head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:16px}
.talaan-tour /* payrun */
.steps{display:flex;gap:0;margin-bottom:20px}
.talaan-tour .step{flex:1;display:flex;align-items:center;gap:9px;font-size:14px;font-weight:600;color:var(--muted);position:relative}
.talaan-tour .step b{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#fff;border:2px solid var(--line);font-size:13px;flex:none}
.talaan-tour .step.done b{background:var(--green);border-color:var(--green);color:#fff}
.talaan-tour .step.cur{color:var(--navy)}
.talaan-tour .step.cur b{border-color:var(--blue);color:var(--blue);box-shadow:0 0 0 4px var(--blue-pale)}
.talaan-tour .step:not(:last-child)::after{content:"";flex:1;height:2px;background:var(--line);margin:0 10px}
.talaan-tour .drop{border:2px dashed #B9CDE0;border-radius:12px;padding:22px;display:flex;align-items:center;gap:16px;background:#FBFDFF}
.talaan-tour .file{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;background:var(--green-pale);color:#18623A;font-weight:600}
.talaan-tour .good{display:flex;align-items:center;gap:10px;color:#18623A;font-weight:600}
.talaan-tour .memo{display:flex;align-items:center;gap:10px;background:var(--mango-pale);border-radius:10px;padding:10px 14px;color:#6B4A00;font-weight:600}
.talaan-tour /* checks */
.check{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-left-width:6px;border-radius:10px;padding:13px 16px;margin-bottom:10px;font-size:15px}
.talaan-tour .check .t{flex:1}
.talaan-tour .check.r{border-left-color:var(--red)}
.talaan-tour .check.a{border-left-color:var(--amber)}
.talaan-tour .check.g{border-left-color:var(--green)}
.talaan-tour .dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px;flex:none}
.talaan-tour /* approve */
.ap{display:grid;grid-template-columns:1fr 300px;gap:36px;height:100%;align-items:center}
.talaan-tour .person{display:flex;align-items:center;gap:12px;padding:14px 16px;background:#fff;border:1px solid var(--line);border-radius:12px}
.talaan-tour .av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700}
.talaan-tour .role{font-size:12px;font-weight:700;color:var(--muted)}
.talaan-tour .phone{width:290px;height:440px;border-radius:34px;background:#0E2440;padding:12px;box-shadow:0 20px 40px -20px rgba(14,36,64,.6);margin:0 auto}
.talaan-tour .phone .scr{width:100%;height:100%;border-radius:24px;background:#fff;overflow:hidden;display:flex;flex-direction:column}
.talaan-tour .phone .bar{background:var(--navy);color:#fff;padding:14px 16px 12px;font-weight:700}
.talaan-tour .phone .bd{padding:14px 16px;flex:1;display:flex;flex-direction:column;gap:7px;font-size:14px}
.talaan-tour .kv{display:flex;justify-content:space-between;gap:8px}
.talaan-tour .kv b{font-variant-numeric:tabular-nums}
.talaan-tour .press{animation:press .5s ease forwards;animation-delay:var(--d,0ms)}
@keyframes press{0%{transform:none}40%{transform:scale(.94);filter:brightness(.9)}100%{transform:none;background:var(--green)}}
.talaan-tour .lock{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:99px;background:var(--navy);color:#fff;font-weight:600;font-size:14px}
.talaan-tour /* files */
.agency{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:10px}
.talaan-tour .box{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);display:inline-grid;place-items:center;position:relative}
.talaan-tour .box svg{opacity:0;animation:pop .3s ease-out forwards;animation-delay:var(--d)}
.talaan-tour .box::after{content:"";position:absolute;inset:-2px;border-radius:6px;background:var(--green);opacity:0;animation:fadein .2s forwards;animation-delay:var(--d);z-index:-1}
.talaan-tour .box{z-index:0}
@keyframes fadein{to{opacity:1}}
.talaan-tour .toast{position:absolute;right:30px;bottom:24px;display:flex;align-items:center;gap:10px;background:var(--navy);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600}
.talaan-tour /* xero */
.xbadge{display:inline-flex;align-items:center;gap:8px;background:#13B5EA;color:#fff;font-weight:700;padding:8px 14px;border-radius:99px}
.talaan-tour /* ask */
.chat{max-width:700px;margin:0 auto;display:flex;flex-direction:column;gap:14px;height:100%}
.talaan-tour .chat>*{flex-shrink:0}
.talaan-tour .bub{padding:13px 16px;border-radius:16px;font-size:16px;max-width:80%}
.talaan-tour .bub.me{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:4px}
.talaan-tour .bub.tala{background:var(--ube-pale);color:#2E2266;border-bottom-left-radius:4px}
.talaan-tour .src{display:flex;width:fit-content;gap:6px;margin-top:10px;font-size:13px;font-weight:600;background:#fff;color:var(--ube);border:1px solid #D7CFF7;padding:5px 10px;border-radius:8px}
.talaan-tour .askbar{margin-top:auto;display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--muted)}
.talaan-tour /* language */
.langcards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.talaan-tour .lc{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.talaan-tour .lc h4{margin:0;padding:12px 16px;background:var(--navy);color:#fff;font-size:16px}
.talaan-tour .lc .bd{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.talaan-tour mark{background:var(--mango-pale);color:#6B4A00;border-radius:4px;padding:0 3px;font-weight:700}
.talaan-tour /* ready */
.ready{display:flex;align-items:center;justify-content:center;gap:44px;height:100%}
.talaan-tour .pts{display:flex;flex-direction:column;gap:12px;margin:16px 0 24px}
.talaan-tour .pt{display:flex;align-items:center;gap:12px;font-size:20px;font-weight:700;color:var(--navy)}
.talaan-tour /* Tala */
.tala-svg{width:100%;height:100%;overflow:visible}
.talaan-tour .tala-svg .mouth{transform-origin:50px 64px;transform-box:view-box}
.talaan-tour .talking .tala-svg .mouth{animation:talk .28s ease-in-out infinite alternate}
@keyframes talk{from{transform:scaleY(.4)}to{transform:scaleY(1.25)}}
.talaan-tour .wave .tala-svg{animation:wave 1.6s ease-in-out infinite;transform-origin:50% 90%}
@keyframes wave{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}
@media (max-width:640px){.talaan-tour #prevBtn span,.talaan-tour #nextBtn span{display:none}
.talaan-tour .caption{align-items:flex-start}
.talaan-tour .sub{display:none}
.talaan-tour .cap-text h2{font-size:17px}
.talaan-tour .cap-text p{font-size:15px}
.talaan-tour .tala{flex-basis:56px;height:56px}
.talaan-tour .cbtn{padding:8px 11px}
.talaan-tour .count{display:none}
 }
@media (prefers-reduced-motion: reduce){.talaan-tour .in,.talaan-tour .pop,.talaan-tour .box svg,.talaan-tour .box::after,.talaan-tour .press{animation-duration:1ms!important;animation-delay:0ms!important}
.talaan-tour .wave .tala-svg,.talaan-tour .talking .tala-svg .mouth{animation:none}
 }

.talaan-tour .voicebar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;padding:8px 6px 0}
.talaan-tour .voicebar label{display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:700;color:var(--page-muted)}
.talaan-tour .voicebar select{max-width:320px;padding:7px 9px;border:1px solid var(--card-line);border-radius:9px;background:var(--card);color:var(--page-ink);font:inherit;font-size:13.5px}
.talaan-tour .voicebar .note{font-size:13px;color:var(--page-muted)}
.talaan-tour .tala{position:relative;display:flex;flex-direction:column;align-items:center}
.talaan-tour .nameplate{margin-top:2px;font-size:12px;font-weight:800;color:var(--navy);background:var(--mango-pale);border-radius:99px;padding:1px 8px}

/* Talaan brand and revised scenes */
.talaan-tour .brandline{display:flex;align-items:center;gap:12px}.talaan-tour .brandline h3{font-family:Montserrat,inherit;letter-spacing:.14em;font-size:40px;margin:0;background:linear-gradient(180deg,#F5D27A,#C8901F);-webkit-background-clip:text;background-clip:text;color:transparent}
.talaan-tour .slogan{font-weight:700;color:var(--mango-deep);letter-spacing:.04em}
.talaan-tour .tiles.six{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}.talaan-tour .tiles.six .tile{padding:10px 14px;justify-content:center;border-top:3px solid var(--mango)}
.talaan-tour .search{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 14px;color:var(--muted);font-size:14px;min-width:300px}
.talaan-tour .prefillbox{background:var(--blue-pale);border-radius:12px;padding:12px 16px;display:flex;flex-direction:column;gap:6px}.talaan-tour .prefillbox .pf{display:flex;align-items:center;gap:8px;color:var(--ink)}.talaan-tour .prefillbox .ic{color:var(--green)}
.talaan-tour .filesplit{display:grid;grid-template-columns:1fr 1.15fr;gap:20px}
.talaan-tour .minical{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
.talaan-tour .mcgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:8px}.talaan-tour .mc{min-height:44px;border:1px solid var(--line);border-radius:6px;padding:2px 3px;font-size:10px;display:flex;flex-direction:column;gap:1px}
.talaan-tour .mc.x{border-color:transparent}.talaan-tour .mc span{color:var(--muted);font-weight:700}
.talaan-tour .mc .ev{font-style:normal;font-size:9px;font-weight:700;border-radius:3px;padding:0 3px;background:var(--soft);border-left:2px solid var(--blue)}
.talaan-tour .mc .ev.late{background:#FBE4E6;border-left-color:var(--red)}.talaan-tour .mc .ev.soon{background:#FDEFD9;border-left-color:var(--amber)}.talaan-tour .mc .ev.done{background:#E2F4E9;border-left-color:var(--green)}
.talaan-tour .twocards{display:grid;grid-template-columns:1fr 1fr;gap:18px}.talaan-tour .twocards .panel{padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.talaan-tour .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.talaan-tour .kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column}.talaan-tour .kpi span{color:var(--muted);font-size:13px}.talaan-tour .kpi b{font-size:24px}
.talaan-tour .bars{display:flex;align-items:flex-end;gap:22px;height:180px;padding:12px 10px 0}.talaan-tour .barcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%}
.talaan-tour .barcol i{font-style:normal;font-size:12px;color:var(--muted)}.talaan-tour .bv{display:block;width:60%;background:var(--blue);border-radius:4px 4px 0 0;transform-origin:bottom}
.talaan-tour .ttgrow{animation:ttgrow .9s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0ms)}@keyframes ttgrow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.talaan-tour .btn.green{background:var(--green)}
